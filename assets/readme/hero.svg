<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">llama-cpp-optimizer — launch optimized llama.cpp LLMs</title>
  <desc id="desc">A terminal pipeline showing system detection, model metadata fetch, and derived llama.cpp CLI arguments, next to the llama-cpp-optimizer name.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F65E00"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#F65E00" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F65E00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 400V0H1200"/>
    <path d="M-200 0 H1400" stroke-dasharray="2 14"/>
    <path d="M-200 0 H1400" transform="translate(0 66)"/>
    <path d="M-200 0 H1400" transform="translate(0 132)"/>
    <path d="M-200 0 H1400" transform="translate(0 198)"/>
    <path d="M-200 0 H1400" transform="translate(0 264)"/>
    <path d="M-200 0 H1400" transform="translate(0 330)"/>
  </g>

  <!-- ===================== LEFT: TITLE ===================== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="96" font-size="20" font-weight="600" letter-spacing="6" fill="#F65E00">LLAMA.CPP · AGENT SKILL</text>

    <!-- llama glyph mark + name -->
    <g transform="translate(60,104)">
      <!-- llama head glyph (from llama.cpp brand) -->
      <g transform="translate(0,-6) scale(0.62)" fill="#FAFAFA">
        <path d="M2873.5 1329.73L2790.52 1473.6L2790.03 1473.29C2773.17 1496.21 2746.29 1510 2717.44 1510H2457.5L2542.27 1363.06L2561.5 1329.73H2873.5ZM2561.5 1329.73H2353.5L2451.5 1159.87L2523.5 1035.07C2539.59 1007.18 2569.34 990 2601.53 990C2604.69 990 2607.79 990.157 2610.83 990.46L2610.9 990H2757.5L2561.5 1329.73Z"/>
      </g>
      <text x="92" y="34" font-size="44" font-weight="800" letter-spacing="1" fill="#FAFAFA">llama-cpp<text fill="url(#accentGrad)">-optimizer</text></text>
      <text x="93" y="66" font-size="22" font-weight="500" fill="#c9c9c9">Launch LLMs via llama.cpp — faster inference, lower VRAM / RAM</text>
    </g>

    <!-- description -->
    <text x="64" y="268" font-size="20" line-height="30" fill="#9a9a9a">
      <tspan x="64" dy="0">Parameters derived from model metadata and your real hardware —</tspan>
      <tspan x="64" dy="30">not guesses. Flash attention, quantized KV cache, MoE offload, mmap.</tspan>
    </text>

    <!-- flag chips -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16">
      <g>
        <rect x="64" y="308" width="216" height="40" rx="20" fill="#F65E00" fill-opacity="0.10"/>
        <text x="84" y="333" fill="#FFB27A">--flash-attn on</text>
      </g>
      <g>
        <rect x="292" y="308" width="236" height="40" rx="20" fill="#F65E00" fill-opacity="0.10"/>
        <text x="312" y="333" fill="#FFB27A">--cache-type-k/q q4_0</text>
      </g>
      <g>
        <rect x="540" y="308" width="176" height="40" rx="20" fill="#F65E00" fill-opacity="0.10"/>
        <text x="560" y="333" fill="#FFB27A">--cpu-moe</text>
      </g>
      <g>
        <rect x="728" y="308" width="196" height="40" rx="20" fill="#F65E00" fill-opacity="0.10"/>
        <text x="748" y="333" fill="#FFB27A">--load-mode mmap</text>
      </g>
    </g>
  </g>

  <!-- ===================== RIGHT: TERMINAL PROOF ===================== -->
  <g transform="translate(672,52)">
    <!-- terminal window -->
    <g>
      <rect x="0" y="0" width="452" height="300" rx="14" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1"/>
      <!-- title bar -->
      <rect x="0" y="0" width="452" height="38" rx="14" fill="#171717"/>
      <rect x="0" y="24" width="452" height="14" fill="#171717"/>
      <circle cx="20" cy="19" r="6" fill="#F65E00"/>
      <circle cx="38" cy="19" r="6" fill="#3a3a3a"/>
      <circle cx="56" cy="19" r="6" fill="#3a3a3a"/>
      <text x="226" y="24" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" fill="#6a6a6a">optimize.sh</text>

      <!-- body -->
      <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16">
        <!-- step 1 -->
        <text x="24" y="76" fill="#9a9a9a">$ detect-system</text>
        <text x="24" y="98" fill="#e0e0e0">GPU  RTX 3090  ·  24 GB VRAM</text>
        <text x="24" y="118" fill="#e0e0e0">RAM  128 GB  ·  CPU 16 cores</text>

        <!-- step 2 -->
        <text x="24" y="154" fill="#9a9a9a">$ model-info Qwen3.6-35B-A3B</text>
        <text x="24" y="176" fill="#e0e0e0">arch  MoE  ·  A3B active</text>

        <!-- step 3 -->
        <text x="24" y="212" fill="#9a9a9a">$ derive-params --cli</text>
        <text x="24" y="236" fill="#FFB27A">--flash-attn on</text>
        <text x="24" y="258" fill="#FFB27A">  --n-gpu-layers 20 --cpu-moe</text>
        <text x="24" y="280" fill="#FFB27A">  --cache-type-k q4_0</text>
      </g>
    </g>

    <!-- glow behind terminal handled by bgGrad; arrow connector -->
    <g transform="translate(-34,150)">
      <circle cx="0" cy="0" r="18" fill="#F65E00"/>
      <path d="M-7 -4 L2 0 L-7 4 Z" fill="#111111"/>
    </g>
  </g>

  <!-- bottom accent rule -->
  <rect x="64" y="382" width="1072" height="3" rx="1.5" fill="url(#accentGrad)"/>
</svg>
